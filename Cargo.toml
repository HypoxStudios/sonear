[workspace]
resolver = "3"
members = ["crates/soloist", "crates/spotify", "crates/core", "crates/app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"

[workspace.dependencies]
sonear-soloist = { path = "crates/soloist" }
sonear-spotify = { path = "crates/spotify" }
sonear-core = { path = "crates/core" }

anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6.0"
embed-resource = "3.0"
futures-util = "0.3"
gpui-kit = "=0.9.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = "4.2"
minisign = "0.10"
minisign-verify = "0.3"
rand = "0.9"
raw-window-handle = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "fs"] }
tokio-tungstenite = "0.30"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
windows = "0.62"
wiremock = "0.6"
zip = { version = "9.4", default-features = false, features = ["deflate"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

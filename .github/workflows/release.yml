name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'sonear').version

          if ($env:TAG -ne "v$version") {
            Write-Error "Tag $env:TAG does not match version $version"
            exit 1
          }

          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Build
        run: cargo build --locked -p sonear --release

      - name: Name the setup file
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/sonear.exe "dist/sonear-$env:VERSION-setup.exe"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG "dist/sonear-$env:VERSION-setup.exe" --draft --verify-tag --generate-notes --title "Sonear $env:VERSION"

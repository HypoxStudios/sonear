<!-- The listener closes as soon as this page is sent, so everything stays inline.
     Colours mirror crates/app/src/theme.rs, which this crate can't depend on. -->
<style>
:root {
  --window: #0A090D;
  --panel: #17161C;
  --accent: #C9B2F5;
  --muted-mark: #6E6B77;
  --text: #F5F3F7;
  --text-secondary: #9D9AA6;
  --hairline: rgba(255, 255, 255, .07);
}

* {
  box-sizing: border-box;
  margin: 0;
}

body {
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 16px;
  background: var(--window);
  color: var(--text);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
}

main {
  width: 100%;
  max-width: 440px;
  padding: 36px;
  border: 1px solid var(--hairline);
  border-radius: 16px;
  background: var(--panel);
}

svg {
  display: block;
  width: 56px;
  height: 56px;
  margin-bottom: 20px;
  fill: var(--accent);
}

.off svg {
  fill: var(--muted-mark);
}

h1 {
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.2;
}

p {
  margin-top: 8px;
  color: var(--text-secondary);
  font-size: 15px;
  line-height: 1.5;
}

footer {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--hairline);
  color: var(--text-secondary);
  font-size: 13px;
}

@media (prefers-reduced-motion: no-preference) {
  .on rect {
    transform-box: fill-box;
    transform-origin: center;
    animation: settle 1s cubic-bezier(.3, 0, .2, 1) backwards;
  }

  .on rect:nth-of-type(2) { animation-delay: 70ms; }
  .on rect:nth-of-type(3) { animation-delay: 140ms; }
  .on rect:nth-of-type(4) { animation-delay: 210ms; }
  .on rect:nth-of-type(5) { animation-delay: 280ms; }
}

@keyframes settle {
  0% { transform: scaleY(.2); }
  40% { transform: scaleY(1.12); }
  70% { transform: scaleY(.82); }
  100% { transform: scaleY(1); }
}
</style>

_version: 2

youtube.api:
  en: "YouTube Music answered %{status}: %{message}"
  es: "YouTube Music respondió %{status}: %{message}"
youtube.decode:
  en: "could not read YouTube Music's answer: %{detail}"
  es: "No se pudo leer la respuesta de YouTube Music: %{detail}"
youtube.needs_login:
  en: "YouTube Music needs you to sign in"
  es: "YouTube Music necesita que inicies sesión"
